services:
  web:
    image: markoshust/magento-nginx:1.24
    container_name: web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src/magento:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - phpfpm
      - db
      - redis
      - opensearch

  phpfpm:
    build: 
      context: ./php
      dockerfile: Dockerfile
    container_name: phpfpm
    volumes:
      - ./src/magento:/var/www/html:cached
      - ./php-opcache.ini:/usr/local/etc/php/conf.d/99-opcache.ini:ro
      - ./php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    environment:
      COMPOSER_MEMORY_LIMIT: -1
      MAGENTO_RUN_MODE: developer
      PHP_MEMORY_LIMIT: 4G
      PHP_UPLOAD_MAX_FILESIZE: 64M
      PHP_POST_MAX_SIZE: 64M
      XDEBUG_MODE: develop,debug
      XDEBUG_CLIENT_HOST: host.docker.internal
      XDEBUG_CLIENT_PORT: "9003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9003:9003"
    depends_on:
      - db

  db:
    image: mariadb:10.4
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis
    restart: always

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=lola123!Atrord123!
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"

volumes:
  dbdata:
